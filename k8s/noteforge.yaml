apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteforge
  labels:
    app: noteforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: noteforge
  template:
    metadata:
      labels:
        app: noteforge
    spec:
      containers:
        - name: noteforge
          image: evangelionz/noteforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4173
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: noteforge
  labels:
    app: noteforge
spec:
  type: LoadBalancer
  selector:
    app: noteforge
  ports:
    - name: http
      port: 80
      targetPort: 4173